<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>簡単なダイスゲーム</title>
</head>
<body>
  <section id="authSection">
  <h2>アカウント登録</h2>

  <input
    id="signupEmail"
    type="email"
    placeholder="メールアドレス"
  >

  <input
    id="signupPassword"
    type="password"
    placeholder="パスワード"
  >

  <button id="signupButton">登録</button>

  <h2>ログイン</h2>

  <input
    id="loginEmail"
    type="email"
    placeholder="メールアドレス"
  >

  <input
    id="loginPassword"
    type="password"
    placeholder="パスワード"
  >

  <button id="loginButton">ログイン</button>

  <button id="logoutButton" hidden>ログアウト</button>

  <p id="authStatus">未ログイン</p>
</section>
<section id="SelectSection">
  <h2>キャラクター選択</h2>
  
  <select id="characterSelect">
    <option value="">キャラクターを選択してください</option>
  </select>
  <button id="reloadCharacters">一覧を更新</button>
  <p id="selectedCharacterStatus">キャラクター未選択</p>
  <h1>キャラクター作成</h1>
</section>
<section id="ConfigSection">
  <label>
    キャラクター名：
    <input id="characterName" type="text">
  </label>

  <br><br>

  <label>
    筋力：
    <input id="strength" type="number" value="10" min="1" max="100">
  </label>

  <br><br>

  <button id="saveCharacter">キャラクターを保存</button>

</section>
<section id="LogSection">

  <h1>ダイス判定</h1>
  <button id="rollDice">1d6を振る</button>

  <h2>ログ</h2>
  <div id="logs"></div>
</section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
