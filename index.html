<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TRPG ゲーム</title>
  <!-- Supabase JS クライアント -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>キャラ設定</h1>
  <input id="charName" placeholder="名前">
  <button onclick="saveCharacter()">保存</button>
  
  <h1>ダイスロール</h1>
  <button onclick="rollDice()">1d6 ロール</button>
  <div id="log"></div>

  <script>
    // Supabase クライアント初期化
    const SUPABASE_URL = 'https://bmupitsejqwclwwwstkf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_b4G9bU5ucW-oyXwnO--Gqg_zBekVQJw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // キャラ保存
    async function saveCharacter() {
      const name = document.getElementById('charName').value;
      const { data, error } = await supabase
        .from('characters')
        .insert({ 
          user_id: 'user123', // 実際は認証 ID を使用
          name: name,
          stats: { str: 10, dex: 12 }
        });
      
      if (error) console.error('保存エラー:', error);
      else alert('保存完了！');
    }

    // ダイスロール
    async function rollDice() {
      const result = Math.floor(Math.random() * 6) + 1;
      
      // ログ保存
      await supabase
        .from('logs')
        .insert({
          character_id: 'character-uuid',
          dice_result: result,
          description: `1d6 = ${result}`
        });
      
      document.getElementById('log').innerHTML += `<p>1d6 = ${result}</p>`;
    }
  </script>
</body>
</html>
