<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>簡単なダイスゲーム</title>
</head>
<body>
  <h1>キャラクター作成</h1>

  <label>
    キャラクター名：
    <input id="characterName" type="text">
  </label>

  <br><br>

  <label>
    筋力：
    <input id="strength" type="number" value="10" min="1" max="100">
  </label>

  <br><br>

  <button id="saveCharacter">キャラクターを保存</button>

  <hr>

  <h1>ダイス判定</h1>
  <button id="rollDice">1d6を振る</button>

  <h2>ログ</h2>
  <div id="logs"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
